Macro States==巨集狀態
Ready: Macro has been loaded but hasn't started running==Ready（就緒）：巨集已載入但尚未開始執行
Running: Macro is currently executing==Running（執行中）：巨集正在執行
Paused: Macro execution has been temporarily stopped==Paused（已暫停）：巨集執行已被暫時停止
Completed: Macro has finished execution==Completed（已完成）：巨集已執行完畢
Failed: Macro encountered an error during execution==Failed（失敗）：巨集在執行過程中發生錯誤
Macros can be configured to trigger automatically based on specific game events:==巨集可以設定為根據特定的遊戲事件自動觸發：
Lua macros can also be configured to have individual functions trigger automatically (provided the script was already running).==Lua 巨集也可以設定讓個別函式自動觸發（前提是該腳本已經在執行中）。
Any function that begins with the name of a TriggerEvent will be registered in the ?? when the script is started.==任何以 TriggerEvent 名稱開頭的函式，都會在腳本啟動時註冊到 ?? 中。
For ?? specifically, the event name must be followed by the addon name and event type, such as==特別是對於 ??，事件名稱後面必須接上 addon 名稱與事件類型，例如
Macro Metadata==巨集中繼資料
General==一般
Macros can be configured with metadata to provide specific configurations to the framework regarding macro execution.==巨集可以設定中繼資料，為框架提供關於巨集執行方式的特定設定。
The metadata can be edited in the Macros Settings section when a macro is selected in the library.==在資料庫中選取某個巨集後，可以在「巨集設定」區塊編輯其中繼資料。
The metadata can be written to the file using the button provided in the above section. This is crucial for macros stored remotely (i.e. github) for the framework to know what settings to use when they're imported==可以使用上方區塊提供的按鈕，將中繼資料寫入檔案。這對於存放在遠端（例如 github）的巨集來說十分重要，可讓框架在匯入時知道該使用哪些設定
Dependencies and conflicts==相依性與衝突
Macros can also be configured to require other plugins to run, and a message will be printed if the requirement is not met.==巨集也可以設定為需要其他插件才能執行，若不符合此需求則會印出訊息。
Similiarly, macros can be configured to disable other plugins while running, though this requires plugins to be pre-defined in the framework to support this.==同樣地，巨集也可以設定在執行期間停用其他插件，不過這需要相關插件事先在框架中預先定義以支援此功能。
Like plugin dependencies, macros can support relying on other macros, whether they're local (already loaded into snd) or remote (i.e. github)==如同插件相依性一樣，巨集也可以相依於其他巨集，不論是本機的（已載入 snd 中）還是遠端的（例如 github）
Git Integration==Git 整合
Macros can now be connected to a github url and auto converted into a "Git Macro"==巨集現在可以連結至 github 網址，並自動轉換為「Git 巨集」
Git macros support auto updating when a new version is released (checked on startup), and going between versions via the version history modal (found in the Macro Settings section)==Git 巨集支援在有新版本發布時自動更新（於啟動時檢查），並可透過版本歷史對話框（位於「巨集設定」區塊中）在不同版本間切換
A macro is automatically identified as a git macro when it has a repository url in its metadata. To convert a git macro back into a local macro, simply wipe the url or click the Reset Git Data button in the settings==當巨集的中繼資料中含有儲存庫網址時，會自動被識別為 Git 巨集。若要將 Git 巨集轉回本機巨集，只需清空網址，或點擊設定中的「重設 Git 資料」按鈕即可
Virtual Keys==虛擬按鍵
Use the /send command to simulate keyboard input. This is useful for interacting with UI elements that don't have dedicated click commands.==使用 /send 指令來模擬鍵盤輸入。這對於與沒有專屬點擊指令的 UI 元素互動非常有用。
