Modifiers==修飾詞
?? is an expansion of the native macro system, with smart helpers, additional commands and modifiers, and unlimited macros.==?? 是原生巨集系統的擴充功能，提供智慧輔助工具、額外的指令與修飾詞，以及無限量的巨集。
It also supports scripting with Lua, so you can write macros that are more complex than the native system can handle.==它同時也支援使用 Lua 進行腳本編寫，讓你可以寫出比原生系統所能處理的更複雜的巨集。
Status Monitoring==狀態監控
