Fixed recursive spawning of temporary macros caused by function-level trigger events==修正函式層級觸發事件造成暫存巨集遞迴產生的問題
Added pause/resume/stop all commands==新增全部暫停/繼續/停止指令
Added a lua stub generator (outputs in config directory, used for script linting) by Faye==新增由 Faye 製作的 lua stub 產生器（輸出於設定目錄，用於腳本檢查）
Fixed native macro execution where waits weren't being applied properly==修正原生巨集執行時等待未正確套用的問題
Fixed /loop==修正 /loop
Fixed craft skip trigger on non craft actions==修正非製作動作觸發製作跳過的問題
Added imports for all enums, now callable via luanet.enum==新增所有列舉的匯入，現在可透過 luanet.enum 呼叫
Added OnCleanup function for lua scripts.==為 lua 腳本新增 OnCleanup 函式
Added syntax highlighting to the editor==編輯器新增語法高亮
Added type change ability in the editor==編輯器新增變更類型的功能
Fixed Craftloop, and some action skip/waits==修正 Craftloop 以及部分動作跳過/等待的問題
Fixed autoretainer post process event==修正 autoretainer 後處理事件
Added more advanced stub generator by Faye==新增由 Faye 製作的進階 stub 產生器
Fixed remote dependencies and added a file cache system==修正遠端依賴項並新增檔案快取系統
Fixed deleting folders. Added renaming folders.==修正刪除資料夾的問題，新增重新命名資料夾功能
Added a config module to provide macros with configurable settings, editable outside of code==新增設定模組，提供巨集可在程式碼外編輯的可設定選項
Added import from url for new macros.==新增從網址匯入新巨集的功能
Added OnActivePluginsChanged==新增 OnActivePluginsChanged
Changed list index modifier name from listindex to list==將清單索引修飾詞名稱從 listindex 改為 list
Added duty started/wiped/completed events==新增副本開始/團滅/完成事件
Fixed git macros resetting configs on update==修正 git 巨集在更新時重置設定的問題
